<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Results to Google Sheets</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1220;
    --surface: #131b2e;
    --surface-hover: #1a2540;
    --border: #1e2d4a;
    --accent: #00d4ff;
    --accent-glow: rgba(0, 212, 255, 0.15);
    --accent-dim: #0097b8;
    --correct: #00e88f;
    --wrong: #ff4d6a;
    --text: #e4e8f1;
    --text-dim: #7a89a8;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  /* ambient bg glow */
  body::before {
    content: '';
    position: fixed;
    top: -30%; left: -10%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  /* ─── Header ─── */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.4rem;
  }
  .header p {
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  /* ─── Setup banner ─── */
  .setup-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid #f59e0b;
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    margin-bottom: 2rem;
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .setup-banner strong { color: #f59e0b; }
  .setup-banner code {
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
  }

  /* ─── Progress ─── */
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    border-radius: 99px;
    width: 0%;
    transition: width 0.5s ease;
  }

  /* ─── Name input ─── */
  .name-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .name-section label {
    display: block;
    font-weight: 500;
    margin-bottom: 0.6rem;
    font-size: 0.95rem;
  }
  .name-section input {
    width: 100%;
    padding: 0.7rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-section input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* ─── Question card ─── */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.4s ease forwards;
  }
  .question-card:nth-child(2) { animation-delay: 0.05s; }
  .question-card:nth-child(3) { animation-delay: 0.10s; }
  .question-card:nth-child(4) { animation-delay: 0.15s; }
  .question-card:nth-child(5) { animation-delay: 0.20s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .question-number {
    display: inline-block;
    background: var(--accent-glow);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 0.7rem;
    letter-spacing: 0.05em;
  }

  .question-text {
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 1rem;
  }

  /* ─── Options ─── */
  .options { display: flex; flex-direction: column; gap: 0.5rem; }

  .option {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.92rem;
    position: relative;
  }
  .option:hover {
    background: var(--surface-hover);
    border-color: var(--accent-dim);
  }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .option input[type="radio"] { display: none; }

  .radio-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .option.selected .radio-dot {
    border-color: var(--accent);
  }
  .option.selected .radio-dot::after {
    content: '';
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ─── Submit ─── */
  .submit-area { text-align: center; margin-top: 1.5rem; }

  .btn-submit {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 2.4rem;
    background: linear-gradient(135deg, var(--accent), #0097b8);
    color: #0c1220;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.02em;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0, 212, 255, 0.3);
  }
  .btn-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ─── Results ─── */
  .results-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
    animation: fadeUp 0.4s ease forwards;
  }
  .results-card.show { display: block; }

  .score-ring {
    width: 120px; height: 120px;
    margin: 0 auto 1.2rem;
    position: relative;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring circle {
    fill: none;
    stroke-width: 6;
  }
  .score-ring .bg-ring { stroke: var(--border); }
  .score-ring .fg-ring {
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-dasharray: 339.292;
    stroke-dashoffset: 339.292;
    transition: stroke-dashoffset 1.2s ease;
  }
  .score-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-text .big {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .score-text .label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .results-status {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }
  .results-detail {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .sheet-status {
    font-size: 0.8rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    display: inline-block;
  }
  .sheet-status.success {
    background: rgba(0, 232, 143, 0.1);
    color: var(--correct);
  }
  .sheet-status.error {
    background: rgba(255, 77, 106, 0.1);
    color: var(--wrong);
  }
  .sheet-status.sending {
    background: var(--accent-glow);
    color: var(--accent);
  }

  /* ─── Spinner ─── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Responsive ─── */
  @media (max-width: 500px) {
    .header h1 { font-size: 1.6rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Knowledge Quiz</h1>
    <p>Answer all questions, results are saved to Google Sheets</p>
  </div>
  <div class="setup-banner">
    <strong>Good luck</strong></strong> :)
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <form id="quizForm">
    <div class="name-section">
      <label for="studentName">Your Name</label>
      <input type="text" id="studentName" placeholder="Enter your full name…" required>
    </div>

    <div id="questionsContainer"></div>

    <div class="submit-area">
      <button type="submit" class="btn-submit" id="submitBtn" disabled>
        Submit Answers
      </button>
    </div>
  </form>

  <div class="results-card" id="resultsCard">
    <div class="score-ring">
      <svg viewBox="0 0 120 120">
        <circle class="bg-ring" cx="60" cy="60" r="54"/>
        <circle class="fg-ring" id="scoreRing" cx="60" cy="60" r="54"/>
      </svg>
      <div class="score-text">
        <span class="big" id="scoreNum">0</span>
        <span class="label">Score</span>
      </div>
    </div>
    <div class="results-status" id="resultsStatus"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <div class="sheet-status sending" id="sheetStatus">
      <span class="spinner"></span> Saving to Google Sheets…
    </div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  CONFIGURATION                                              ║
// ║  Replace with your deployed Google Apps Script Web App URL   ║
// ╚══════════════════════════════════════════════════════════════╝
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBOON8OEjM5GY02p7qSWGvXadTjGqb4DIFRpg6012eUVJ5tt-e4DatZU1m1N6l_TTaNA/exec';

// ╔══════════════════════════════════════════════════════════════╗
// ║  QUIZ DATA — Edit your questions here                        ║
// ║  Each question: { q, options[], answer (index 0-based) }     ║
// ╚══════════════════════════════════════════════════════════════╝
const QUESTIONS = [
  {
    q: "What does HTML stand for?",
    options: [
      "Hyper Text Markup Language",
      "High Tech Modern Language",
      "Hyperlink and Text Markup Language",
      "Home Tool Markup Language"
    ],
    answer: 0
  },
  {
    q: "Which planet is known as the Red Planet?",
    options: ["Venus", "Mars", "Jupiter", "Saturn"],
    answer: 1
  },
  {
    q: "What is the time complexity of binary search?",
    options: ["O(n)", "O(n²)", "O(log n)", "O(1)"],
    answer: 2
  },
  {
    q: "In which year did the World Wide Web become publicly available?",
    options: ["1989", "1991", "1995", "2000"],
    answer: 1
  },
  {
    q: "What does CSS stand for?",
    options: [
      "Computer Style Sheets",
      "Cascading Style Sheets",
      "Creative Style System",
      "Colorful Style Sheets"
    ],
    answer: 1
  }
];

// ─── Render questions ───
const container = document.getElementById('questionsContainer');
const form = document.getElementById('quizForm');
const submitBtn = document.getElementById('submitBtn');
const progressFill = document.getElementById('progressFill');

QUESTIONS.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.innerHTML = `
    <div class="question-number">QUESTION ${i + 1}</div>
    <div class="question-text">${item.q}</div>
    <div class="options">
      ${item.options.map((opt, j) => `
        <label class="option" data-q="${i}" data-o="${j}">
          <input type="radio" name="q${i}" value="${j}">
          <span class="radio-dot"></span>
          <span>${opt}</span>
        </label>
      `).join('')}
    </div>
  `;
  container.appendChild(card);
});

// ─── Option selection logic ───
document.querySelectorAll('.option').forEach(opt => {
  opt.addEventListener('click', function() {
    const qIndex = this.dataset.q;
    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(o => o.classList.remove('selected'));
    this.classList.add('selected');
    this.querySelector('input').checked = true;
    updateProgress();
  });
});

function updateProgress() {
  const answered = QUESTIONS.filter((_, i) => document.querySelector(`input[name="q${i}"]:checked`)).length;
  const nameOk = document.getElementById('studentName').value.trim().length > 0;
  const total = QUESTIONS.length;
  const pct = (answered / total) * 100;
  progressFill.style.width = pct + '%';
  submitBtn.disabled = !(answered === total && nameOk);
}

document.getElementById('studentName').addEventListener('input', updateProgress);

// ─── Submit ───
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('studentName').value.trim();
  const answers = [];
  let score = 0;

  QUESTIONS.forEach((item, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const chosenIndex = parseInt(selected.value);
    const isCorrect = chosenIndex === item.answer;
    if (isCorrect) score++;
    answers.push({
      question: item.q,
      chosen: item.options[chosenIndex],
      correct: item.options[item.answer],
      isCorrect
    });
  });

  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);

  // Show results
  form.style.display = 'none';
  document.querySelector('.setup-banner').style.display = 'none';
  const resultsCard = document.getElementById('resultsCard');
  resultsCard.classList.add('show');

  document.getElementById('scoreNum').textContent = `${score}/${total}`;
  document.getElementById('resultsStatus').textContent =
    pct >= 80 ? 'Excellent!' : pct >= 50 ? 'Good effort!' : 'Keep studying!';
  document.getElementById('resultsDetail').textContent =
    `You scored ${pct}% (${score} out of ${total} correct)`;

  // Animate ring
  const ring = document.getElementById('scoreRing');
  const circumference = 2 * Math.PI * 54;
  setTimeout(() => {
    ring.style.strokeDashoffset = circumference - (circumference * (score / total));
  }, 100);

  // ─── Send to Google Sheets ───
  const sheetStatus = document.getElementById('sheetStatus');

  const payload = {
    timestamp: new Date().toISOString(),
    name: name,
    score: score,
    total: total,
    percentage: pct,
    answers: answers.map(a => `${a.chosen} (${a.isCorrect ? '✓' : '✗'})`).join(' | ')
  };

  try {
    if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
      throw new Error('Google Apps Script URL not configured');
    }

    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script requires no-cors
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    // no-cors → opaque response, so we assume success
    sheetStatus.className = 'sheet-status success';
    sheetStatus.innerHTML = '✓ Results saved to Google Sheets';

  } catch (err) {
    sheetStatus.className = 'sheet-status error';
    sheetStatus.innerHTML = '✗ Could not save — ' + err.message;
    console.error('Sheet save error:', err);
  }
});
</script>
</body>
</html>
